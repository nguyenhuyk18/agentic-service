# CI/CD cho agentic-ai (FastAPI).
#   push main -> build image -> push ECR (tag = git SHA) -> deploy ECS service agentic-ai
# Bước deploy chỉ chạy khi repo variable ECS_DEPLOY_ENABLED = true (bật sau khi đã tạo ECS).
# Repo variables cần có: AWS_ROLE_ARN (từ major-guide/deploy/aws/setup-cicd.sh)
name: Agentic AI CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: agentic-ai-cicd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: majorguide/agentic-ai
  ECS_CLUSTER: majorguide
  ECS_SERVICE: agentic-ai

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Tag trên ECR là immutable: chạy lại cùng commit thì dùng lại image đã có.
      - id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=agentic-ai
          cache-to: type=gha,mode=max,scope=agentic-ai

  deploy:
    name: Deploy agentic-ai
    needs: build
    if: vars.ECS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition majorguide-$ECS_SERVICE \
            --query taskDefinition > task-definition.json
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ needs.build.outputs.tag }}" >> "$GITHUB_ENV"
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_SERVICE }}
          image: ${{ env.IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
